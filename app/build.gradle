plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexos.firmador'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nexos.firmador'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Los 3 jars de BouncyCastle repiten estos ficheros META-INF: no hacen falta en el APK.
    packaging {
        resources {
            excludes += [
                    'META-INF/BC2048KE.SF',
                    'META-INF/BC2048KE.DSA',
                    'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                    'META-INF/versions/9/module-info.class'
            ]
        }
    }
}

dependencies {
    // Motor de firma v1/v2/v3 (el mismo que usa apksigner). Se empaqueta en el APK.
    implementation 'com.android.tools.build:apksig:8.5.2'
    // Generación de claves RSA + certificado autofirmado X.509. Se empaqueta en el APK.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}
