name: Build Firmador APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.FIRMADOR_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Test + Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Build Firmador APK failed, see tail of the log:'
            echo '```'
            tail -c 40000 build.log 2>/dev/null
            tail -c 10000 build-release.log 2>/dev/null
            echo '```'
          } > failure-report.md
          gh issue create --title "CI failure: Firmador APK" --body-file failure-report.md

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: firmador-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: success() && startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.FIRMADOR_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > release.jks

      - name: Build release APK (signed)
        if: success() && startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          FIRMADOR_STORE_PASS: ${{ secrets.FIRMADOR_STORE_PASS }}
          FIRMADOR_KEY_ALIAS: ${{ secrets.FIRMADOR_KEY_ALIAS }}
          FIRMADOR_KEY_PASS: ${{ secrets.FIRMADOR_KEY_PASS }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log

      - name: Publish GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish signed release APK
        if: success() && startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk

      - name: Close resolved failure reports
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --search "CI failure: Firmador APK in:title" --state open --json number -q '.[].number' | xargs -r -n1 gh issue close
